# Optional alternative to deploy/Caddyfile, for a host that already runs nginx.
# Caddy is the supported path: it handles the certificate itself, where this
# needs certbot run separately.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/untrackme
#   sudo ln -s /etc/nginx/sites-available/untrackme /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d untrackme.narek.actcollege.am
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name untrackme.narek.actcollege.am;

    # certbot --nginx rewrites this block to redirect to 443 and adds the
    # ssl_certificate lines to a second server block.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A tool that strips tracking has no business keeping an access log.
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
